<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexAgent - AI Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a25;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #2d2d3a;
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 顶部导航 */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .logo-text {
            font-size: 1.25rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        /* 主内容区 */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* 侧边栏 */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 1rem;
        }

        .sidebar-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
            letter-spacing: 0.05em;
        }

        .new-chat-btn {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px dashed var(--border);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            margin-bottom: 1rem;
            transition: all 0.2s;
            font-size: 0.875rem;
        }

        .new-chat-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .conversations {
            flex: 1;
            overflow-y: auto;
        }

        .conversation-item {
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.875rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-item:hover {
            background: var(--bg-tertiary);
        }

        .conversation-item.active {
            background: var(--accent);
            color: white;
        }

        /* 模型选择器 */
        .model-selector {
            padding: 1rem;
            border-top: 1px solid var(--border);
        }

        .model-select {
            width: 100%;
            padding: 0.5rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 0.875rem;
        }

        /* 聊天区 */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .message {
            margin-bottom: 1.5rem;
            max-width: 80%;
        }

        .message.user {
            margin-left: auto;
        }

        .message.assistant {
            margin-right: auto;
        }

        .message-content {
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.9375rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.user .message-content {
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
            padding: 0 0.25rem;
        }

        /* 欢迎页面 */
        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .welcome-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }

        .welcome h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent), #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            max-width: 400px;
        }

        /* 输入区 */
        .input-area {
            padding: 1rem 1.5rem;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
        }

        .input-container {
            display: flex;
            gap: 0.75rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .input-box {
            flex: 1;
            display: flex;
            align-items: flex-end;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            transition: border-color 0.2s;
        }

        .input-box:focus-within {
            border-color: var(--accent);
        }

        #message-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 0.9375rem;
            resize: none;
            max-height: 150px;
            outline: none;
        }

        #message-input::placeholder {
            color: var(--text-muted);
        }

        .send-btn {
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            border: none;
            background: var(--accent);
            color: white;
            cursor: pointer;
            font-size: 0.9375rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .send-btn:hover:not(:disabled) {
            background: var(--accent-hover);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 加载动画 */
        .loading {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
        }

        .loading-dots {
            display: flex;
            gap: 4px;
        }

        .loading-dots span {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* 设置面板 */
        .settings-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .settings-overlay.show {
            display: flex;
        }

        .settings-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            width: 400px;
            max-width: 90%;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .settings-header h2 {
            font-size: 1.25rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.5rem;
            padding: 0.25rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 0.875rem;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* 工具列表 */
        .tools-section {
            padding: 1rem 1.5rem;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            display: none;
        }

        .tools-section.show {
            display: block;
        }

        .tools-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .tools-header h3 {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.5rem;
        }

        .tool-item {
            padding: 0.5rem 0.75rem;
            background: var(--bg-tertiary);
            border-radius: 6px;
            font-size: 0.8125rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .tool-icon {
            color: var(--accent);
        }

        /* 隐藏文件上传 */
        .file-input {
            display: none;
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <header class="header">
        <div class="logo">
            <div class="logo-icon">🤖</div>
            <span class="logo-text">NexAgent</span>
        </div>
        <div class="header-actions">
            <button class="btn" id="tools-btn" onclick="toggleTools()">
                🛠️ 工具
            </button>
            <button class="btn" id="settings-btn" onclick="openSettings()">
                ⚙️ 设置
            </button>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="main">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <button class="new-chat-btn" onclick="newConversation()">
                ➕ 新建对话
            </button>

            <div class="sidebar-title">历史对话</div>
            <div class="conversations" id="conversations-list">
                <!-- 对话列表 -->
            </div>

            <div class="model-selector">
                <div class="sidebar-title">模型选择</div>
                <select class="model-select" id="model-select" onchange="changeModel()">
                    <option value="openrouter">OpenRouter</option>
                    <option value="deepseek">DeepSeek</option>
                    <option value="gemini">Google Gemini</option>
                    <option value="groq">Groq</option>
                    <option value="sili">硅基流动</option>
                    <option value="zhipu">智谱 GLM</option>
                </select>
            </div>
        </aside>

        <!-- 聊天区 -->
        <section class="chat-area">
            <!-- 欢迎页面 -->
            <div class="welcome" id="welcome">
                <div class="welcome-icon">🚀</div>
                <h1>NexAgent</h1>
                <p>Windows 通用 AI Agent 框架，支持文件操作、代码执行、浏览器控制、API 调用等多种工具</p>
                <button class="btn btn-primary" onclick="startChat()">
                    开始对话
                </button>
            </div>

            <!-- 消息区域 -->
            <div class="messages" id="messages" style="display: none;">
                <!-- 消息列表 -->
            </div>

            <!-- 输入区 -->
            <div class="input-area">
                <div class="input-container">
                    <div class="input-box">
                        <textarea
                            id="message-input"
                            placeholder="输入消息，Shift+Enter 换行，Enter 发送..."
                            rows="1"
                        ></textarea>
                    </div>
                    <button class="send-btn" id="send-btn" onclick="sendMessage()">
                        发送
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- 工具列表 -->
    <div class="tools-section" id="tools-section">
        <div class="tools-header">
            <h3>可用工具</h3>
            <button class="close-btn" onclick="toggleTools()">×</button>
        </div>
        <div class="tools-grid" id="tools-grid">
            <!-- 工具列表 -->
        </div>
    </div>

    <!-- 设置面板 -->
    <div class="settings-overlay" id="settings-overlay">
        <div class="settings-panel">
            <div class="settings-header">
                <h2>⚙️ 设置</h2>
                <button class="close-btn" onclick="closeSettings()">×</button>
            </div>

            <div class="form-group">
                <label>模型提供商</label>
                <select id="settings-provider">
                    <option value="openrouter">OpenRouter</option>
                    <option value="deepseek">DeepSeek</option>
                    <option value="gemini">Google Gemini</option>
                    <option value="groq">Groq</option>
                    <option value="sili">硅基流动</option>
                    <option value="zhipu">智谱 GLM</option>
                </select>
            </div>

            <div class="form-group">
                <label>API Key</label>
                <input type="password" id="settings-api-key" placeholder="输入 API Key（留空使用默认）">
            </div>

            <div class="form-group">
                <label>模型名称</label>
                <input type="text" id="settings-model-name" placeholder="如: deepseek-chat">
            </div>

            <button class="btn btn-primary" style="width: 100%; margin-top: 1rem;" onclick="saveSettings()">
                保存设置
            </button>
        </div>
    </div>

    <script>
        // 状态管理
        let currentConversationId = null;
        let isLoading = false;

        // DOM 元素
        const messagesEl = document.getElementById('messages');
        const welcomeEl = document.getElementById('welcome');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const modelSelect = document.getElementById('model-select');

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadConversations();
            loadConfig();
            loadTools();
            setupInputHandler();
        });

        // 设置输入框
        function setupInputHandler() {
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            messageInput.addEventListener('input', () => {
                messageInput.style.height = 'auto';
                messageInput.style.height = Math.min(messageInput.scrollHeight, 150) + 'px';
            });
        }

        // 开始对话
        function startChat() {
            welcomeEl.style.display = 'none';
            messagesEl.style.display = 'block';
        }

        // 新建对话
        function newConversation() {
            currentConversationId = null;
            messagesEl.innerHTML = '';
            welcomeEl.style.display = 'flex';
            messagesEl.style.display = 'none';
            loadConversations();
        }

        // 加载对话列表
        async function loadConversations() {
            const list = document.getElementById('conversations-list');
            list.innerHTML = '<div class="loading" style="padding: 1rem; justify-content: center;"><span style="color: var(--text-muted);">暂无历史对话</span></div>';
        }

        // 加载配置
        async function loadConfig() {
            try {
                const res = await fetch('/api/config');
                const data = await res.json();
                if (data.model && data.model.provider) {
                    modelSelect.value = data.model.provider;
                }
            } catch (e) {
                console.error('加载配置失败:', e);
            }
        }

        // 加载工具列表
        async function loadTools() {
            try {
                const res = await fetch('/api/tools');
                const data = await res.json();
                const grid = document.getElementById('tools-grid');

                const toolIcons = {
                    'read_file': '📄',
                    'write_file': '✏️',
                    'list_directory': '📁',
                    'delete_file': '🗑️',
                    'execute_python': '🐍',
                    'execute_shell': '💻',
                    'open_vscode': '📝',
                    'open_pycharm': '🐍',
                    'browser_navigate': '🌐',
                    'browser_screenshot': '📸',
                    'http_get': '⬇️',
                    'http_post': '⬆️',
                    'web_search': '🔍',
                };

                grid.innerHTML = data.tools.map(tool => `
                    <div class="tool-item">
                        <span class="tool-icon">${toolIcons[tool.name] || '🔧'}</span>
                        <span>${tool.name}</span>
                    </div>
                `).join('');
            } catch (e) {
                console.error('加载工具列表失败:', e);
            }
        }

        // 切换模型
        function changeModel() {
            const provider = modelSelect.value;
            fetch('/api/config', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({provider})
            });
        }

        // 发送消息
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message || isLoading) return;

            // 切换到聊天视图
            if (welcomeEl.style.display !== 'none') {
                startChat();
            }

            // 添加用户消息
            addMessage('user', message);
            messageInput.value = '';
            messageInput.style.height = 'auto';

            // 显示加载
            showLoading();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        message,
                        provider: modelSelect.value,
                        conversation_id: currentConversationId
                    })
                });

                const data = await res.json();

                hideLoading();
                addMessage('assistant', data.response);

                // 更新当前对话 ID
                if (!currentConversationId && data.conversation_id) {
                    currentConversationId = data.conversation_id;
                }

                // 刷新对话列表
                loadConversations();

            } catch (e) {
                hideLoading();
                addMessage('assistant', '抱歉，发生错误: ' + e.message);
            }
        }

        // 添加消息
        function addMessage(role, content) {
            const msg = document.createElement('div');
            msg.className = `message ${role}`;

            const time = new Date().toLocaleTimeString('zh-CN', {
                hour: '2-digit',
                minute: '2-digit'
            });

            msg.innerHTML = `
                <div class="message-content">${escapeHtml(content)}</div>
                <div class="message-time">${time}</div>
            `;

            messagesEl.appendChild(msg);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // 显示加载
        function showLoading() {
            isLoading = true;
            sendBtn.disabled = true;

            const loading = document.createElement('div');
            loading.className = 'message assistant';
            loading.id = 'loading-msg';
            loading.innerHTML = `
                <div class="message-content">
                    <div class="loading">
                        <span>思考中</span>
                        <div class="loading-dots">
                            <span></span><span></span><span></span>
                        </div>
                    </div>
                </div>
            `;
            messagesEl.appendChild(loading);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // 隐藏加载
        function hideLoading() {
            isLoading = false;
            sendBtn.disabled = false;

            const loading = document.getElementById('loading-msg');
            if (loading) loading.remove();
        }

        // 工具面板
        function toggleTools() {
            document.getElementById('tools-section').classList.toggle('show');
        }

        // 设置面板
        function openSettings() {
            document.getElementById('settings-overlay').classList.add('show');
        }

        function closeSettings() {
            document.getElementById('settings-overlay').classList.remove('show');
        }

        async function saveSettings() {
            const provider = document.getElementById('settings-provider').value;
            const apiKey = document.getElementById('settings-api-key').value;
            const modelName = document.getElementById('settings-model-name').value;

            try {
                await fetch('/api/config', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({provider, api_key: apiKey, model_name: modelName})
                });

                modelSelect.value = provider;
                closeSettings();
                alert('设置已保存');
            } catch (e) {
                alert('保存失败: ' + e.message);
            }
        }

        // HTML 转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML.replace(/\n/g, '<br>');
        }
    </script>
</body>
</html>
